name: CI autofix

# When a watched workflow fails on the default branch, Claude reads the failed
# log, reproduces it, fixes the root cause on a throwaway branch and opens a PR.
# It never pushes to the default branch and never weakens a test, scan or
# threshold. Needs one repo secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# Without the secret the job skips instead of failing.
#
# Same file in every repo; only the two marked lines differ.

on:
  workflow_run:
    workflows: ["CI"]  # per repo: the workflow(s) to watch
    types: [completed]
    branches: [main, master]

env:
  PY_VERSION: "3.10"  # per repo: the Python version its CI uses

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  autofix:
    # Only real failures of a push; never react to the bot's own work.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'fix(ci-autofix)')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Secret check
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; autofix skipped."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Collect failed log
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed > /tmp/ci-failed.log || true
          grep -nE "not ok|FAIL|Error|error:|Traceback|AssertionError" /tmp/ci-failed.log | head -n 150 > /tmp/ci-summary.txt || true

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(pwsh:*),Bash(git:*),Bash(gh pr create:*),Bash(curl:*),Bash(unzip:*),Bash(chmod:*),Bash(timeout:*),Bash(mkdir:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            The workflow "${{ github.event.workflow_run.name }}" failed on
            ${{ github.event.workflow_run.head_branch }} at commit ${{ github.event.workflow_run.head_sha }}
            (run ${{ github.event.workflow_run.html_url }}).
            The failed log is /tmp/ci-failed.log, a short summary is /tmp/ci-summary.txt.
            Node 22 and Python ${{ env.PY_VERSION }} are installed.

            1. Read the failed workflow file under .github/workflows/ and the repo's
               AGENTS.md / CLAUDE.md / CONTRIBUTING.md if present. Install what it installs
               (npm ci, pip install, a pinned Godot download...) and run the same commands
               to reproduce the failure. Think about version and OS differences.
            2. Fix the cause in source. Forbidden: deleting or skipping tests, loosening
               assertions, raising thresholds or warning limits, narrowing secret or security
               scans, suppression comments (noqa, ts-ignore, eslint-disable...), editing
               .github/workflows. If the failure is flaky or external (network, runner outage,
               missing repo setting), change nothing and stop.
            3. Add or update a test that would have caught it. If the repo keeps a
               CHANGELOG.md, add an entry under its unreleased section.
            4. Re-run every command of the failed workflow; all must pass.
            5. git switch -c ci-autofix/${{ github.event.workflow_run.head_sha }},
               commit with message "fix(ci-autofix): <what was wrong>", push that branch,
               then gh pr create --base ${{ github.event.workflow_run.head_branch }} with the
               root cause, the fix and the command results in the body. Never push to
               ${{ github.event.workflow_run.head_branch }}.
