<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Cosmic Deep Navy to Midnight Slate) -->
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#1e184a" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Signature Antigravity Spectral Gradient (Cyan -> Emerald -> Gold -> Coral -> Violet -> Deep Blue) -->
    <linearGradient id="antigravityGrad" x1="0%" y1="100%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="18%" stop-color="#10b981"/>
      <stop offset="36%" stop-color="#facc15"/>
      <stop offset="52%" stop-color="#fb7185"/>
      <stop offset="72%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Arc Ribbon Vertical Flow Gradient -->
    <linearGradient id="arcStrokeGrad" x1="0%" y1="90%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#22c55e"/>
      <stop offset="38%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="62%" stop-color="#f43f5e"/>
      <stop offset="82%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Shield Border Gradient (Flowing with Antigravity Harmony) -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#818cf8"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Shield Interior Gradient -->
    <linearGradient id="shieldInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>

    <!-- Core Singularity Gradient (Prismatic Airbag Nexus) -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="32%" stop-color="#38bdf8"/>
      <stop offset="68%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Gravitational Wave Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="22%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Bloom / Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Intense Hero Arc Glow Filter -->
    <filter id="arcGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shield Drop Shadow -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#antigravityGrad)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- 2. Ambient Gravitational Field Rings (Background Orbitals) -->
  <g opacity="0.55" filter="url(#neonGlow)">
    <ellipse cx="256" cy="244" rx="206" ry="62" transform="rotate(-26 256 244)" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="14 8"/>
    <ellipse cx="256" cy="244" rx="186" ry="52" transform="rotate(34 256 244)" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="20 10"/>
  </g>

  <!-- 3. The Iconic Antigravity "A" Warp Arc (Hero Spectral Ribbon) -->
  <g filter="url(#arcGlow)">
    <!-- Broad Neon Aura -->
    <path d="M 120 404 
             C 126 172, 204 58, 256 58 
             C 308 58, 386 172, 392 404" 
          fill="none" 
          stroke="url(#arcStrokeGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          opacity="0.9"/>
    
    <!-- Luminous Inner Specular Core -->
    <path d="M 120 404 
             C 126 172, 204 58, 256 58 
             C 308 58, 386 172, 392 404" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.7"/>
  </g>

  <!-- 4. Airbag Shockwave Arcs -->
  <path d="M 152 168 C 205 126, 307 126, 360 168" fill="none" stroke="url(#antigravityGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <path d="M 174 190 C 218 156, 294 156, 338 190" fill="none" stroke="url(#antigravityGrad)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- 5. The Guardian Shield (Main Body) -->
  <g filter="url(#shieldShadow)">
    <!-- Shield Outer Shell -->
    <path d="M 256 88 
             C 326 88, 384 108, 384 182 
             C 384 288, 310 368, 256 422 
             C 202 368, 128 288, 128 182 
             C 128 108, 186 88, 256 88 Z" 
          fill="url(#shieldInnerGrad)" 
          stroke="url(#shieldBorderGrad)" 
          stroke-width="6.5" 
          stroke-linejoin="round"/>

    <!-- Shield Inner Bevel Highlight -->
    <path d="M 256 102 
             C 316 102, 368 118, 368 186 
             C 368 276, 302 348, 256 398 
             C 210 348, 144 276, 144 186 
             C 144 118, 196 102, 256 102 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.8" 
          stroke-opacity="0.25"/>
  </g>

  <!-- 6. Gravitational Singularity Foreground Orbital Ring -->
  <g filter="url(#neonGlow)">
    <ellipse cx="256" cy="240" rx="150" ry="46" transform="rotate(-18 256 240)" fill="none" stroke="url(#antigravityGrad)" stroke-width="4.5"/>
  </g>

  <!-- 7. Architectural Airbag Geometric Core (Diamond Nexus with Antigravity Flare) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Core Diamond -->
    <polygon points="256,166 316,236 256,306 196,236" 
             fill="url(#coreGrad)" 
             stroke="#ffffff" 
             stroke-width="2.5" 
             stroke-opacity="0.9"/>

    <!-- Inner Core Geometry (The Constitutional Gatekeeper) -->
    <polygon points="256,186 298,236 256,286 214,236" 
             fill="#020617" 
             fill-opacity="0.93" 
             stroke="url(#antigravityGrad)" 
             stroke-width="2"/>

    <!-- Central Singularity Spark -->
    <polygon points="256,208 276,236 256,264 236,236" 
             fill="#ffffff" 
             opacity="0.95"/>
    <circle cx="256" cy="236" r="6" fill="#facc15"/>
    <circle cx="256" cy="236" r="2.5" fill="#ffffff"/>
  </g>

  <!-- 8. Bottom Verification Anchor (Checkmark Gatekeeper Key) -->
  <path d="M 238 338 L 252 352 L 276 324" 
        fill="none" 
        stroke="#2dd4bf" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- 9. Top Specular Glints & Antigravity Crest Particles -->
  <circle cx="256" cy="58" r="5" fill="#facc15" filter="url(#neonGlow)"/>
  <circle cx="256" cy="58" r="2.5" fill="#ffffff"/>
  <circle cx="344" cy="118" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="168" cy="118" r="2" fill="#38bdf8" opacity="0.85"/>
</svg>
